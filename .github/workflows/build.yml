name: Build Modern ARM64 APK
# Build a distributable APK from the exact main release source.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamzawy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modern:
    name: Build Modern APK (ARM64, matching current release architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run regression tests
        run: npm test
      - name: Generate app icons and splash from official logo
        run: |
          mkdir -p assets
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("assets/LOGO_UPLOAD_HERE/logo.png")
          if not source.is_file():
              raise SystemExit("Official logo missing: assets/LOGO_UPLOAD_HERE/logo.png")
          logo = Image.open(source).convert("RGBA")
          if logo.width < 128 or logo.height < 128:
              raise SystemExit("Official logo image is unexpectedly small")
          logo = logo.resize((1024, 1024), Image.Resampling.LANCZOS)
          logo.thumbnail((860, 860), Image.Resampling.LANCZOS)
          x = (1024 - logo.width) // 2
          y = (1024 - logo.height) // 2
          legacy = Image.new("RGBA", (1024, 1024), "#F4F8FC")
          legacy.alpha_composite(logo, (x, y))
          legacy.convert("RGB").save("assets/icon.png", quality=95)
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          foreground.alpha_composite(logo, (x, y))
          foreground.save("assets/adaptive-icon.png")
          Image.open(source).convert("RGBA").save("assets/splash-icon.png")
          Image.open(source).convert("RGB").save("assets/splash.png", quality=95)
          PY
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Restore and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::One or more required release-signing secrets are empty."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

          keytool -list -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python3 - <<'PY2'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          source = path.read_text()

          def locate_block(text, name, start=0, limit=None):
              if limit is None:
                  limit = len(text)
              pattern = re.compile(r"(?m)^([ \t]*)" + re.escape(name) + r"\s*\{")
              match = pattern.search(text, start, limit)
              if not match:
                  return None
              opening = text.find("{", match.start(), match.end())
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = opening
              while i < limit:
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < limit else ""
                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                  elif block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 1
                  elif quote:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  elif ch == "/" and nxt == "/":
                      line_comment = True
                      i += 1
                  elif ch == "/" and nxt == "*":
                      block_comment = True
                      i += 1
                  elif ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return (match.start(), i + 1, opening, match.group(1))
                  i += 1
              raise SystemExit(f"Unbalanced Gradle block: {name}")

          def release_config(indent):
              inner = indent + "    "
              return "\n".join([
                  indent + "release {",
                  inner + "def signingProps = new Properties()",
                  inner + "def signingFile = rootProject.file('key.properties')",
                  inner + "if (!signingFile.isFile()) throw new GradleException('Release key.properties is missing')",
                  inner + "signingProps.load(new FileInputStream(signingFile))",
                  inner + "storeFile file(signingProps['storeFile'])",
                  inner + "storePassword signingProps['storePassword']",
                  inner + "keyAlias signingProps['keyAlias']",
                  inner + "keyPassword signingProps['keyPassword']",
                  indent + "}"
              ])

          android = locate_block(source, "android")
          if not android:
              raise SystemExit("Could not locate android { } block in generated build.gradle")

          signing = locate_block(source, "signingConfigs", android[2], android[1])
          if signing:
              existing_release = locate_block(source, "release", signing[2], signing[1])
              if existing_release:
                  config = release_config(existing_release[3])
                  source = source[:existing_release[0]] + config + source[existing_release[1]:]
              else:
                  config = release_config(signing[3] + "    ")
                  source = source[:signing[1]-1] + "\n" + config + "\n" + signing[3] + source[signing[1]-1:]
          else:
              signing_indent = android[3] + "    "
              config = signing_indent + "signingConfigs {\n" + release_config(signing_indent + "    ") + "\n" + signing_indent + "}"
              source = source[:android[1]-1] + "\n" + config + "\n" + android[3] + source[android[1]-1:]

          android = locate_block(source, "android")
          build_types = locate_block(source, "buildTypes", android[2], android[1])
          if not build_types:
              raise SystemExit("Could not locate buildTypes { } block")
          release_type = locate_block(source, "release", build_types[2], build_types[1])
          if not release_type:
              raise SystemExit("Could not locate buildTypes.release block")

          release_body = source[release_type[2]+1:release_type[1]-1]
          release_body = re.sub(r"(?m)^[ \t]*signingConfig\s+[^\n]*\n?", "", release_body)
          release_body = "\n" + release_type[3] + "    signingConfig signingConfigs.release\n" + release_body
          source = source[:release_type[2]+1] + release_body + source[release_type[1]-1:]

          android = locate_block(source, "android")
          build_types = locate_block(source, "buildTypes", android[2], android[1])
          release_type = locate_block(source, "release", build_types[2], build_types[1])
          final_body = source[release_type[2]+1:release_type[1]-1]
          if not re.search(r"(?m)^[ \t]*signingConfig\s+signingConfigs\.release\s*$", final_body):
              raise SystemExit("Release signingConfig was not applied to buildTypes.release")
          path.write_text(source)
          print("Verified Gradle configuration: buildTypes.release -> signingConfigs.release")
          PY2

      - name: Configure Modern APK
        run: |
          printf '\nexpo.useLegacyPackaging=true\nreactNativeArchitectures=arm64-v8a\n' >> android/gradle.properties
          grep -E '^(expo.useLegacyPackaging|reactNativeArchitectures)=' android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          marker = "defaultConfig {"
          if marker not in source:
              raise SystemExit("Could not find Android defaultConfig block")
          if "abiFilters" not in source:
              source = source.replace(marker, marker + chr(10) + "        ndk {" + chr(10) + "            abiFilters 'arm64-v8a'" + chr(10) + "        }", 1)
          path.write_text(source)
          PY
          grep -n -A4 "defaultConfig {" android/app/build.gradle
      - name: Build Modern Release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "Modern APK bytes: $(stat -c%s "$APK")"
          du -h "$APK"
          echo "Modern APK ABIs:"
          unzip -Z1 "$APK" | grep "^lib/" | cut -d/ -f2 | sort -u
          cp "$APK" ../HSsat.apk

      - name: Verify APK signature matches configured release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          ACTUAL_SHA256="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1)"
          EXPECTED_SHA256="$(keytool -exportcert -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 | awk '{print $NF}')"
          ACTUAL_NORMALIZED="$(printf '%s' "$ACTUAL_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$ACTUAL_NORMALIZED" =~ ^[0-9a-f]{64}$ || "$ACTUAL_NORMALIZED" != "$EXPECTED_NORMALIZED" ]]; then
            echo "::error::APK signer certificate does not match the configured release keystore."
            echo "Expected release certificate SHA-256: $EXPECTED_NORMALIZED"
            echo "Actual APK signer SHA-256: $ACTUAL_NORMALIZED"
            exit 1
          fi

          echo "APK signature verified: signer certificate matches the configured release keystore."
          echo "Release certificate SHA-256: $ACTUAL_NORMALIZED"

      - uses: actions/upload-artifact@v4
        with:
          name: hamzawy-sat-modern-apk
          path: HSsat.apk

      - name: Set release metadata
        run: |
          echo "APP_VERSION=$(node -p 'require("./app.json").expo.version')" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(node -p 'require("./app.json").expo.android.versionCode')" >> "$GITHUB_ENV"
      - name: Publish versioned APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: SATVIEW ${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: HSsat.apk
          fail_on_unmatched_files: true
