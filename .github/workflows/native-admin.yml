name: Native Admin Android Build

on:
  push:
    paths:
      - "native-admin/**"
      - ".github/workflows/native-admin.yml"
  pull_request:
    paths:
      - "native-admin/**"
      - ".github/workflows/native-admin.yml"

# Keep only the newest build for a branch. Push and pull_request events
# for the same PR branch share one concurrency group, avoiding duplicate APK builds.
concurrency:
  group: native-admin-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Check admin panel URL configuration
        env:
          ADMIN_PANEL_URL: ${{ secrets.ADMIN_PANEL_URL }}
        run: |
          if [ -n "$ADMIN_PANEL_URL" ]; then
            echo "Admin panel URL supplied securely for this build."
          else
            echo "::notice::ADMIN_PANEL_URL secret is not set; the app will request the private URL once on first launch."
          fi
      - name: Build native-admin only
        env:
          ADMIN_PANEL_URL: ${{ secrets.ADMIN_PANEL_URL }}
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-admin-debug-apk
          path: native-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: native-admin
          script: gradle :app:connectedDebugAndroidTest
