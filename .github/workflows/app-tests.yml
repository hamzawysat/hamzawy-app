name: App Automated Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/app-tests.yml'
  push:
    branches: [ main, 'integration/hamzawy-unified-work', 'refactor/app-organization-2026-10-31', 'feature/sync-web-updates-20261103', 'feature/central-api-config-20261116', 'fix/native-tab-grid-20261116', 'fix/technician-id-card-upload-20261116', 'fix/technician-home-default-20261116', 'fix/technician-tabs-10-grid-20261117', 'fix/push-notification-tap-routing', 'fix/referrals-rewards-2026-11' ]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

jobs:
  app-tests:
    name: Static regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app dependencies
        run: npm install --legacy-peer-deps
      - name: Run automated tests
        run: node --test tests/*.test.js
      - name: Bundle Android JavaScript (no APK)
        run: npx expo export --platform android --output-dir /tmp/sonaa-app-export
